[project]
name = "event-smeta"
version = "1.0.0"
description = "Сайт агентства мероприятий: калькулятор сметы, заявки в Telegram и мини-CRM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Артём Ильин" }]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["dist", "instance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Кириллица, «ёлочки», тире и знак × в строках — норма для русского проекта
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/icons.py" = ["E501"]  # данные путей SVG не переносим

[tool.ruff.lint.isort]
known-first-party = ["app", "bot", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
